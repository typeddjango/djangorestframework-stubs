- case: test_generic_api_view_serializer_type
  main: |
    from typing import Any
    from typing_extensions import reveal_type
    from rest_framework import generics, viewsets
    from rest_framework.serializers import BaseSerializer
    from myapp.models import MyModel

    class MySerializer(BaseSerializer[Any]):
        def to_dto(self) -> dict[str, str]: ...

    class MyView(generics.GenericAPIView[Any, MySerializer]):
        serializer_class = MySerializer

    class MyViewSet(viewsets.ModelViewSet[MyModel, MySerializer]): ...

    class Plain(generics.GenericAPIView[MyModel]): ...

    reveal_type(MyView().get_serializer())  # N: Revealed type is "main.MySerializer"
    reveal_type(MyView().get_serializer_class())  # N: Revealed type is "type[main.MySerializer]"
    reveal_type(MyViewSet().get_serializer())  # N: Revealed type is "main.MySerializer"
    reveal_type(Plain().get_serializer())  # N: Revealed type is "rest_framework.serializers.BaseSerializer[myapp.models.MyModel]"
  installed_apps:
      - myapp
  files:
      -   path: myapp/__init__.py
      -   path: myapp/models.py
          content: |
              from django.db import models
              class MyModel(models.Model):
                  pass

- case: test_destroy_api_view
  main: |
    from typing_extensions import override
    from rest_framework import generics
    from myapp.models import MyModel

    class MyView(generics.DestroyAPIView):
        queryset = MyModel.objects.all()

        @override
        def perform_destroy(self, instance: MyModel) -> None: ...
  installed_apps:
      - myapp
  files:
      -   path: myapp/__init__.py
      -   path: myapp/models.py
          content: |
              from django.db import models
              class MyModel(models.Model):
                  pass
