- case: test_exception_input
  main: |
    from django.utils.translation import gettext_lazy as _
    from rest_framework.exceptions import APIException, ErrorDetail

    test_exception = APIException({
        'a': [
            'value',
            _('translated'),
            ErrorDetail('with code', code='brown'),
            {'b': 'test', 'c': _('translated')},
            ('also', 'tuple', ErrorDetail('value')),
        ]
    })
    APIException(detail=test_exception.detail, code='123')
    APIException(detail=[test_exception.detail], code='123')
    APIException('I am just a message', code='msg')
    APIException()
    APIException(None, None)
    APIException(1)  # E: Argument 1 to "APIException" has incompatible type "int"; expected "_APIExceptionInput"  [arg-type]
    APIException({'a': 1})  # E: Argument 1 to "APIException" has incompatible type "dict[str, int]"; expected "_APIExceptionInput"  [arg-type]
    APIException({'a': ['test', 1]})  # E: Argument 1 to "APIException" has incompatible type "dict[str, list[str | int]]"; expected "_APIExceptionInput"  [arg-type]

- case: test_exception_input_index_keyed
  main: |
    from rest_framework.exceptions import ErrorDetail, ValidationError

    # DRF itself raises `ValidationError` with list-index keys, e.g. `ListField.run_child_validation`
    # and, since DRF 3.18, `ListSerializer.to_internal_value`.
    ValidationError({0: ['A valid integer is required.']})
    ValidationError({0: {'field': ErrorDetail('required', code='required')}})

    index_errors: dict[int, list[str]] = {0: ['A valid integer is required.']}
    ValidationError(index_errors)

    field_errors: dict[str, list[str]] = {'field': ['A valid integer is required.']}
    ValidationError(field_errors)

    ValidationError({0: 1})  # E: Argument 1 to "ValidationError" has incompatible type "dict[int, int]"; expected "_APIExceptionInput"  [arg-type]
