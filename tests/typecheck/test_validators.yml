-   case: serializer_level_validators_are_rejected_by_fields
    main: |
        from django.contrib.auth.models import User
        from rest_framework.fields import CharField, DictField
        from rest_framework.validators import UniqueTogetherValidator, UniqueValidator

        CharField(validators=[UniqueValidator(queryset=User.objects.all())])
        # DictField supplies a compatible value type, so rejection is due to the context:
        # UniqueTogetherValidator requires a serializer, not an ordinary field.
        DictField(validators=[UniqueTogetherValidator(queryset=User.objects.all(), fields=["username"])])
    out: |
        main:8: error: List item 0 has incompatible type "UniqueTogetherValidator"; expected "Callable[[dict[Any, Any]], None] | ContextValidator[dict[Any, Any], Field[Any, Any, Any, Any]]"  [list-item]
        main:8: note: Following member(s) of "UniqueTogetherValidator" have conflicts:
        main:8: note:     Expected:
        main:8: note:         def __call__(self, dict[Any, Any], Field[Any, Any, Any, Any], /) -> None
        main:8: note:     Got:
        main:8: note:         def __call__(self, attrs: MutableMapping[str, Any], serializer: BaseSerializer[Any]) -> None
